name: Build Custom Minimal OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create ISO Directory Structure
        run: |
          mkdir -p iso_root/boot/grub
          echo 'set timeout=5' > iso_root/boot/grub/grub.cfg
          echo 'menuentry "Minimal Core2Duo OS" { echo "Booting Minimal OS..." }' >> iso_root/boot/grub/grub.cfg

      - name: Install Genisoimage and Build ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
          genisoimage -o minimal-core2duo-os.iso -R -J iso_root

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-OS-ISO
          path: minimal-core2duo-os.iso
